name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run project checks
        run: |
          # bash explícito: arquivos criados via API não carregam bit de execução
          if [ -f .github/ci/run-checks.sh ]; then
            bash .github/ci/run-checks.sh
          elif [ -f package.json ]; then
            npm ci --no-audit && npm test --if-present
          else
            echo "Nenhum check configurado ainda — adicione .github/ci/run-checks.sh"
          fi
